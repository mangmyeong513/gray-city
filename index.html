<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f0e6" />
  <title>TXT Reader</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    :root{
      --bg:#f6f0e6;
      --card:#fffaf3;
      --text:#2b241c;
      --muted:#7d6f61;
      --border:rgba(43,36,28,.10);
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --top-h:86px;
      --bottom-h:86px;
      --font-size:16px;
      --line-height:1.82;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;padding:0;background:var(--bg);color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
      height:100%;
      overflow:hidden;
    }
    .app{max-width:760px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding-top:var(--safe-top);padding-bottom:var(--safe-bottom)}
    .top{
      flex:0 0 auto;
      height:var(--top-h);
      padding:10px 12px 8px;
      background:var(--bg);
      border-bottom:1px solid var(--border);
    }
    .topcard{
      height:100%;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:10px 12px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:8px;
    }
    .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
    .title{font-size:17px;font-weight:800;letter-spacing:-.02em}
    .status{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row{display:flex;gap:8px;align-items:center}
    .btn{
      appearance:none;border:1px solid var(--border);background:#2b241c;color:#fff;
      border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;cursor:pointer;
    }
    .btn.secondary{background:var(--card);color:var(--text)}
    .main{
      flex:1 1 auto;
      min-height:0;
      padding:10px 12px;
    }
    .reader{
      height:100%;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:14px 14px 10px;
      overflow:hidden;
      position:relative;
    }
    .page{
      height:100%;
      overflow:hidden;
    }
    .empty{
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
    }
    .meta{
      font-size:12px;color:var(--muted);margin-bottom:10px;
    }
    .para{
      margin:0 0 14px;
      font-size:var(--font-size);
      line-height:var(--line-height);
      white-space:pre-wrap;
      word-break:break-word;
      overflow-wrap:anywhere;
    }
    .seg-bold{font-weight:800}
    .seg-star{font-style:italic;opacity:.68}
    .seg-double{color:#5b4431}
    details.acc{
      margin:0 0 14px;
      border:1px solid var(--border);
      border-radius:14px;
      background:rgba(255,255,255,.35);
      overflow:hidden;
    }
    details.acc summary{
      list-style:none;
      cursor:pointer;
      padding:12px 14px;
      font-size:14px;
      font-weight:700;
      color:var(--text);
      background:rgba(0,0,0,.02);
    }
    details.acc summary::-webkit-details-marker{display:none}
    .acc-body{padding:12px 14px 2px}
    .bottom{
      flex:0 0 auto;
      height:var(--bottom-h);
      padding:8px 12px 10px;
      background:var(--bg);
      border-top:1px solid var(--border);
    }
    .bottomcard{
      height:100%;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:8px 10px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:6px;
    }
    .navrow{display:flex;gap:8px;align-items:center}
    .grow{flex:1}
    input[type="range"]{width:100%}
    .small{font-size:12px;color:var(--muted)}
    .measure-wrap{
      position:absolute;left:-99999px;top:0;width:min(100vw,760px);
      visibility:hidden;pointer-events:none;
    }
    .measure-box{
      background:var(--card);
      border:1px solid transparent;
      padding:14px 14px 10px;
      width:100%;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="topcard">
        <div class="head">
          <div class="title">TXT Reader</div>
          <div id="status" class="status">파일을 선택하세요</div>
        </div>
        <div class="row">
          <button id="pickBtn" class="btn">TXT 불러오기</button>
          <button id="resumeBtn" class="btn secondary">이어읽기</button>
          <button id="installBtn" class="btn secondary">앱 설치</button>
          <input id="fileInput" type="file" accept=".txt,text/plain" hidden />
        </div>
      </div>
    </div>

    <div class="main">
      <div id="reader" class="reader">
        <div id="page" class="page">
          <div class="empty">TXT 파일을 선택하면 문단 단위 페이지로 보여요.</div>
        </div>
      </div>
    </div>

    <div class="bottom">
      <div class="bottomcard">
        <div class="navrow">
          <button id="prevBtn" class="btn secondary">이전</button>
          <div id="pageInfo" class="small grow">0 / 0 페이지</div>
          <button id="nextBtn" class="btn secondary">다음</button>
        </div>
        <div class="navrow">
          <input id="pageRange" class="grow" type="range" min="1" max="1" value="1" />
        </div>
      </div>
    </div>
  </div>

  <div class="measure-wrap">
    <div id="measureBox" class="measure-box"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
