<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f4efe6" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <title>TXT Reader Line Optimized</title>
  <style>
    :root{
      --bg:#f4efe6;
      --surface:#fbf8f2;
      --surface-2:#f1eadf;
      --text:#2e2419;
      --muted:#8b7764;
      --border:rgba(46,36,25,.10);
      --accent:#20170f;
      --reader-size:17px;
      --reader-line:1.88;
      --reader-font:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
      --header-h:58px;
      --bottom-h:146px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;padding:0;min-height:100%;
      background:var(--bg);color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
      overflow-x:hidden;
    }
    body{display:flex;justify-content:center}
    button,input{font:inherit}
    .hidden{display:none!important}
    .app{width:100%;max-width:430px;min-height:100dvh;background:var(--bg);position:relative;overflow:hidden}
    .screen{min-height:100dvh;background:var(--bg)}
    .topbar{
      position:fixed;left:0;right:0;top:0;z-index:30;height:calc(var(--header-h) + var(--safe-top));
      padding:calc(var(--safe-top) + 10px) 16px 10px;border-bottom:1px solid var(--border);background:var(--bg);
      display:flex;align-items:center;justify-content:space-between;transition:transform .16s ease, opacity .16s ease;
    }
    .topbar.hide-ui{transform:translateY(-110%);opacity:0}
    .brand{display:flex;align-items:center;gap:12px;min-width:0}
    .brand-mark{width:36px;height:36px;border-radius:14px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:17px;flex:0 0 auto}
    .brand-title{font-size:15px;font-weight:800;letter-spacing:-.02em}
    .brand-sub{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
    .icon-btn,.menu-btn,.book-card,.chip-btn,.tab-btn,.sheet-btn{
      border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:16px;cursor:pointer;
    }
    .icon-btn{width:42px;height:42px;display:grid;place-items:center;font-size:18px}
    .menu-btn{width:100%;height:48px;padding:0 14px;text-align:left;font-weight:800;margin-top:10px}
    .chip-btn{height:36px;padding:0 12px;border-radius:999px;background:transparent;font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .chip-btn.active,.tab-btn.active{background:var(--accent);color:#fff;border-color:transparent}
    .tab-btn{height:38px;background:transparent;font-size:13px;font-weight:800}
    .library{padding:calc(var(--header-h) + var(--safe-top) + 18px) 16px 24px;min-height:100dvh;overflow:auto}
    .hero{padding:18px;border-radius:28px;background:var(--surface);border:1px solid var(--border);margin-bottom:14px}
    .hero-title{font-size:22px;font-weight:900;letter-spacing:-.03em}
    .hero-sub{font-size:13px;color:var(--muted);line-height:1.6;margin-top:8px}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 10px}
    .section-title{font-size:13px;font-weight:800;color:var(--muted)}
    .book-list{display:grid;gap:10px}
    .book-card{width:100%;padding:14px 14px 12px;text-align:left;border-radius:22px;background:var(--surface)}
    .book-title{font-size:15px;font-weight:800;line-height:1.35;letter-spacing:-.02em}
    .book-meta{font-size:12px;color:var(--muted);margin-top:7px}
    .book-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
    .empty{padding:22px 8px 8px;font-size:14px;line-height:1.65;color:var(--muted)}
    .reader-screen{height:100dvh;overflow:hidden}
    .reader-shell{height:100dvh;overflow:hidden;position:relative;padding-top:calc(var(--header-h) + var(--safe-top));padding-bottom:calc(var(--bottom-h) + var(--safe-bottom))}
    .reader{height:100%;overflow:hidden;padding:8px 14px 10px}
    .page-box{height:100%;overflow:hidden;width:100%;font-family:var(--reader-font)}
    .page-line,.line-h1,.line-h2,.line-h3,.line-quote{
      word-break:break-word;overflow-wrap:anywhere;max-width:100%;user-select:text;
    }
    .page-line{margin:0;font-size:var(--reader-size);line-height:var(--reader-line);color:var(--text);letter-spacing:-.015em;white-space:pre-wrap}
    .line-gap{height:calc(var(--reader-size) * 0.42);min-height:8px}
    .seg-bold{font-weight:800}
    .seg-star{font-style:italic;opacity:.62}
    .seg-star.no-italic{font-style:normal}
    .seg-double{opacity:.95}
    .seg-single{opacity:.88}
    .line-h1{font-size:calc(var(--reader-size) * 1.46);line-height:1.25;margin:0 0 10px;font-weight:900;letter-spacing:-.03em}
    .line-h2{font-size:calc(var(--reader-size) * 1.25);line-height:1.28;margin:0 0 8px;font-weight:900;letter-spacing:-.03em}
    .line-h3{font-size:calc(var(--reader-size) * 1.10);line-height:1.32;margin:0 0 8px;font-weight:900;letter-spacing:-.02em}
    .line-quote{margin:0;padding-left:12px;border-left:3px solid var(--border);color:var(--muted);white-space:pre-wrap}
    .details-summary{display:flex;align-items:center;gap:8px;font-weight:800;color:var(--text);padding:6px 10px;margin:0;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);user-select:none}
    .details-body{margin-top:8px;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.03);border:1px solid var(--border)}
    .tap-zone{position:fixed;top:calc(var(--header-h) + var(--safe-top));bottom:calc(var(--bottom-h) + var(--safe-bottom));z-index:12}
    .tap-left{left:0;width:28%}
    .tap-center{left:28%;width:44%}
    .tap-right{right:0;width:28%}
    .bottom-bar{position:fixed;left:0;right:0;bottom:0;z-index:24;border-top:1px solid var(--border);background:var(--bg);padding:8px 10px calc(8px + var(--safe-bottom));transition:transform .16s ease, opacity .16s ease}
    .bottom-bar.hide-ui{transform:translateY(110%);opacity:0}
    .reading-meta{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);padding:0 4px 6px}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
    .panel{display:none;border:1px solid var(--border);background:var(--surface-2);border-radius:18px;padding:8px}
    .panel.active{display:block}
    .theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .text-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .setting-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px}
    .setting-label{font-size:12px;color:var(--muted);font-weight:800;margin-bottom:8px}
    .marker-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
    input[type=range]{accent-color:var(--accent);width:100%}
    input[type=color]{width:100%;height:42px;border-radius:12px;border:1px solid var(--border);background:transparent;padding:3px}
    .sheet-backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .16s ease}
    .sheet-backdrop.show{opacity:1;pointer-events:auto}
    .sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;background:var(--surface);border-top:1px solid var(--border);border-top-left-radius:26px;border-top-right-radius:26px;padding:12px 14px calc(14px + var(--safe-bottom));transform:translateY(110%);transition:transform .16s ease;max-height:min(82dvh, 720px);overflow:auto}
    .sheet.show{transform:translateY(0)}
    .handle{width:42px;height:5px;border-radius:999px;background:var(--border);margin:2px auto 10px}
    .sheet-title{font-size:16px;font-weight:900;letter-spacing:-.02em;margin-bottom:10px}
    .sheet-grid{display:grid;gap:10px}
    .sheet-btn{height:52px;padding:0 14px;text-align:left;font-weight:800;border-radius:18px}
    .sheet-note{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
    .font-chip{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-radius:18px;background:var(--surface-2);border:1px solid var(--border);font-size:13px}
    .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
    .stat-card{background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:12px}
    .stat-title{font-size:14px;font-weight:800}
    .stat-meta{font-size:12px;color:var(--muted);margin-top:6px}
    .measure-line{position:absolute;left:-99999px;top:0;visibility:hidden;pointer-events:none;z-index:-1;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;max-width:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif}
    @media (max-width:380px){
      :root{--bottom-h:182px}
      .text-grid{grid-template-columns:1fr}
      .marker-grid{grid-template-columns:repeat(3,1fr)}
      .brand-sub{max-width:180px}
    }
  </style>
</head>
<body>
  <div class="app">
    <div id="libraryScreen" class="screen">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">📚</div>
          <div>
            <div class="brand-title">TXT Reader Line</div>
            <div class="brand-sub">줄 기반 + HTML풍 블록 지원</div>
          </div>
        </div>
        <button id="libraryMenuBtn" class="icon-btn" aria-label="메뉴">✦</button>
      </header>

      <div class="library">
        <section class="hero">
          <div class="hero-title">줄 기준으로 끊기기</div>
          <div class="hero-sub">
            #, ##, ### 제목과 &gt; 인용문, [details: 제목] 블록을 지원해요. 자동 줄바꿈은 "큰따옴표 블록"에만 강하게 적용돼요.
          </div>
          <button id="importTxtBtnTop" class="menu-btn">TXT 불러오기</button>
          <button id="reopenRecentBtnTop" class="menu-btn">최근 책 다시 열기</button>
          <button id="installBtnTop" class="menu-btn">앱으로 설치</button>
        </section>

        <div class="section-head">
          <div class="section-title">내 서재</div>
        </div>
        <div id="emptyState" class="empty">아직 불러온 책이 없어요. 첫 TXT를 불러와 서재를 채워봐요.</div>
        <div id="bookList" class="book-list"></div>
      </div>
    </div>

    <div id="readerScreen" class="screen reader-screen hidden">
      <header id="readerHeader" class="topbar">
        <div class="brand">
          <div class="brand-mark">📖</div>
          <div>
            <div id="readerTitle" class="brand-title">제목</div>
            <div id="readerSubtitle" class="brand-sub">1 / 1 페이지</div>
          </div>
        </div>
        <button id="readerMenuBtn" class="icon-btn" aria-label="메뉴">✦</button>
      </header>

      <div class="reader-shell">
        <div id="reader" class="reader"></div>
        <div id="tapLeft" class="tap-zone tap-left" aria-hidden="true"></div>
        <div id="tapCenter" class="tap-zone tap-center" aria-hidden="true"></div>
        <div id="tapRight" class="tap-zone tap-right" aria-hidden="true"></div>
      </div>

      <nav id="bottomBar" class="bottom-bar">
        <div class="reading-meta">
          <div id="pageLabel">1 / 1 페이지</div>
          <div id="progressLabel">100%</div>
        </div>

        <div class="tabs">
          <button class="tab-btn active" data-tab="theme">테마</button>
          <button class="tab-btn" data-tab="text">텍스트</button>
          <button class="tab-btn" data-tab="marker">표식</button>
        </div>

        <div class="panel active" data-panel="theme">
          <div class="theme-grid">
            <button class="chip-btn active" data-theme="sepia">셰피아</button>
            <button class="chip-btn" data-theme="light">라이트</button>
            <button class="chip-btn" data-theme="dark">다크</button>
          </div>
        </div>

        <div class="panel" data-panel="text">
          <div class="text-grid">
            <div class="setting-card">
              <div class="setting-label">글자 크기</div>
              <input id="fontSizeRange" type="range" min="14" max="28" step="1" value="17" />
            </div>
            <div class="setting-card">
              <div class="setting-label">줄 간격</div>
              <input id="lineHeightRange" type="range" min="150" max="220" step="5" value="188" />
            </div>
            <div class="setting-card">
              <div class="setting-label">글자 색상</div>
              <input id="textColorInput" type="color" value="#2e2419" />
            </div>
            <div class="setting-card">
              <div class="setting-label">이탤릭</div>
              <button id="italicToggleBtn" class="chip-btn">이탤릭 켜짐</button>
            </div>
            <div class="setting-card">
              <div class="setting-label">기본 줄바꿈</div>
              <button id="wrapToggleBtn" class="chip-btn">기본 줄바꿈 꺼짐</button>
            </div>
            <div class="setting-card">
              <div class="setting-label">기본 문장</div>
              <button id="plainModeToggleBtn" class="chip-btn">서술형</button>
            </div>
          </div>
        </div>

        <div class="panel" data-panel="marker">
          <div class="marker-grid">
            <button class="chip-btn active" data-filter="all">전체</button>
            <button class="chip-btn" data-filter="bold">**</button>
            <button class="chip-btn" data-filter="star">*</button>
            <button class="chip-btn" data-filter="double">"</button>
            <button class="chip-btn" data-filter="single">'</button>
          </div>
        </div>
      </nav>
    </div>

    <div id="sheetBackdrop" class="sheet-backdrop"></div>
    <section id="menuSheet" class="sheet" aria-hidden="true">
      <div class="handle"></div>
      <div class="sheet-title">메뉴</div>
      <div class="sheet-grid">
        <button id="importTxtBtnSheet" class="sheet-btn">TXT 불러오기<span class="sheet-note">TXT 파일을 로컬 서재에 저장</span></button>
        <button id="reopenRecentBtnSheet" class="sheet-btn">최근 책 다시 열기<span class="sheet-note">마지막으로 읽던 책을 바로 열어요</span></button>
        <button id="fontUploadBtn" class="sheet-btn">서체 불러오기<span class="sheet-note">한 개만 유지돼요. 새 서체를 넣으면 이전 서체가 교체돼요.</span></button>
        <button id="resetFontBtn" class="sheet-btn">기본 서체로 되돌리기<span class="sheet-note">커스텀 서체 제거</span></button>
        <button id="goLibraryBtn" class="sheet-btn">서재로 가기<span class="sheet-note">저장된 책 목록 보기</span></button>
        <button id="installBtnSheet" class="sheet-btn">앱으로 설치<span id="installNote" class="sheet-note">설치 가능하면 홈 화면에 추가돼요</span></button>
        <button id="updateAppBtn" class="sheet-btn">업데이트 확인<span id="updateNote" class="sheet-note">새 버전이 있으면 다시 불러와요</span></button>

        <div class="font-chip">
          <div>
            <div style="font-weight:800">현재 서체</div>
            <div id="fontStatus" class="sheet-note">기본 서체</div>
          </div>
          <div style="font-size:18px">Aa</div>
        </div>

        <div>
          <div class="section-title" style="margin:0 2px 10px">현재 책 표식 확인</div>
          <div id="markerStats" class="stats-grid"></div>
        </div>
      </div>
      <input id="txtInput" class="hidden" type="file" accept=".txt,text/plain" />
      <input id="fontInput" class="hidden" type="file" accept=".ttf,.otf,.woff,.woff2" />
    </section>

    <div id="measureLine" class="measure-line"></div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
