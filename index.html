<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f0e6" />
  <title>TXT Reader Minimal</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <style>
    :root{
      --bg:#f6f0e6;
      --card:#fffaf3;
      --text:#2b241c;
      --muted:#7d6f61;
      --border:rgba(43,36,28,.10);
      --safe-top:env(safe-area-inset-top,0px);
      --safe-bottom:env(safe-area-inset-bottom,0px);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;padding:0;background:var(--bg);color:var(--text);
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;
    }
    body{min-height:100dvh}
    .app{
      max-width:760px;
      margin:0 auto;
      padding:calc(12px + var(--safe-top)) 12px calc(18px + var(--safe-bottom));
    }
    .top{
      position:sticky;
      top:0;
      z-index:10;
      padding-bottom:10px;
      background:linear-gradient(to bottom,var(--bg) 80%, rgba(246,240,230,0));
    }
    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:12px;
      box-shadow:0 1px 4px rgba(0,0,0,.03);
    }
    .title{font-size:18px;font-weight:800;letter-spacing:-.02em}
    .sub{font-size:12px;color:var(--muted);line-height:1.5;margin-top:6px}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
    .btn{
      appearance:none;border:1px solid var(--border);
      background:#2b241c;color:#fff;
      border-radius:12px;padding:11px 13px;
      font-size:14px;font-weight:700;cursor:pointer;
    }
    .btn.secondary{background:var(--card);color:var(--text)}
    .status{font-size:12px;color:var(--muted);min-height:18px}
    .reader{
      margin-top:12px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:20px;
      padding:16px 14px;
      min-height:64dvh;
    }
    .meta{
      font-size:12px;color:var(--muted);
      margin-bottom:12px;
    }
    .line{
      margin:0 0 10px;
      font-size:16px;
      line-height:1.8;
      white-space:pre-wrap;
      word-break:break-word;
      overflow-wrap:anywhere;
    }
    .empty{
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="card">
        <div class="title">TXT Reader</div>
        <div class="sub">기본만 남긴 가벼운 리더예요. 잘림 없이 스크롤로 읽고, 큰 파일은 최대한 안 멈추게 처리해요.</div>
        <div class="row">
          <button id="pickBtn" class="btn">TXT 불러오기</button>
          <button id="clearBtn" class="btn secondary">지우기</button>
          <button id="installBtn" class="btn secondary">앱 설치</button>
          <input id="fileInput" type="file" accept=".txt,text/plain" hidden />
        </div>
        <div id="status" class="row status"></div>
      </div>
    </div>

    <div id="reader" class="reader">
      <div class="empty">TXT 파일을 선택하면 여기에 본문이 보여요.</div>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
